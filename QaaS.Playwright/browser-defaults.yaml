# Org-wide browser defaults for QaaS.Probes.Playwright.
# Edit once when forking this library, rebuild, and every consuming
# test repo inherits the values. Per-test YAML can still override
# BrowserUrl via ProbeConfiguration.

# CDP endpoint of the Chrome the probe runs in (Browserless on OpenShift).
# Replace <your-namespace> and <your-token> with your real values.
BrowserUrl: "ws://chrome.<your-namespace>.svc.cluster.local:3000?token=<your-token>"

# Playwright "channel" used by the recorder's codegen. "chrome" =
# system-installed Google Chrome, so no extra browser download.
ChromeChannel: chrome

# Viewport the recorder opens Chrome with (W,H).
RecorderViewport: "1920,1080"

# DOM attribute treated as the "test id": the recorder records it (codegen
# --test-id-attribute) and the probe resolves GetByTestId() against it. Both
# read this one value so they always agree. "data-testid" is Playwright's own
# default, so GetByTestId() means the same here as everywhere else.
TestIdAttribute: data-testid

# Seconds the probe waits for a Chrome it started (BrowserUrl on this
# machine, nothing listening there) to expose CDP.
ChromeStartupTimeoutSeconds: 60
